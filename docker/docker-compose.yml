name: company-crm
services:
  mariadb:
    image: mariadb:11.8
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
  crm:
    build:
      context: ..
    env_file: ../.env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '8080:8080'
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped
volumes:
  mariadb-data:
  redis-data:
  crm-sites:
