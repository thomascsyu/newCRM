user frappe;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # Never put OAuth authorization codes/query strings into access logs.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080 default_server;
    server_name _;
    root /home/frappe/frappe-bench/sites;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location /assets/ { try_files $uri =404; expires 1y; }
    # Uploaded files go through Frappe authentication; never expose sites/configs.
    location /socket.io {
      proxy_pass http://127.0.0.1:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Frappe-Site-Name crm.internal;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Frappe-Site-Name crm.internal;
      proxy_set_header X-Forwarded-Proto https;
      # Append rather than overwrite: preserves the real client IP that Zeabur's
      # edge sets when it reverse-proxies here, so Frappe's rate limiter and
      # audit logs key on the actual visitor rather than the platform's edge IP.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_redirect off;
    }
    # Frappe uses X-Accel-Redirect for authorized private downloads.
    location /protected/ {
      internal;
      alias /home/frappe/frappe-bench/sites/;
    }
  }
}
