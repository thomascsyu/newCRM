user frappe;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # Never put OAuth authorization codes/query strings into access logs: use
  # $uri (path only, no query args), never $request or $request_uri.
  # escape=json handles quoting so no field here needs manual escaping.
  log_format safe escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"forwarded_for":"$http_x_forwarded_for",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"bytes_sent":$bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent"'
    '}';
  access_log /dev/stdout safe;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080 default_server;
    server_name _;
    root /home/frappe/frappe-bench/sites;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    # Echo the per-request correlation id so it can be matched against these
    # access logs and the crm.audit log entries for the same request.
    add_header X-Request-Id $request_id always;
    location /assets/ { try_files $uri =404; expires 1y; }
    # Uploaded files go through Frappe authentication; never expose sites/configs.
    location /socket.io {
      proxy_pass http://127.0.0.1:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Frappe-Site-Name crm.internal;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Frappe-Site-Name crm.internal;
      proxy_set_header X-Forwarded-Proto https;
      # Append rather than overwrite: preserves the real client IP that Zeabur's
      # edge sets when it reverse-proxies here, so Frappe's rate limiter and
      # audit logs key on the actual visitor rather than the platform's edge IP.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
      proxy_redirect off;
    }
    # Frappe uses X-Accel-Redirect for authorized private downloads.
    location /protected/ {
      internal;
      alias /home/frappe/frappe-bench/sites/;
    }
  }
}
